<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify-Click and Listen</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <nav>
            <div class="logo">
                <img src="logo.png" alt="logo"> <span class="text">Spotify</span>
            </div>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
            </ul>
        </nav>
        <main>
            <div id="home">
                <section class="banner">
                    <h1>Welcome to Spotify</h1>
                </section>
                <section class="songlist">
                    <h1>Your Playlist </h1>
                    <div class="songItem">
                        <img src="covers/1.jpg" alt="song 1 cover">
                        <span>It's Always Blue</span>
                    </div>
                    <div class="songItem">
                        <img src="covers/2.jpg" alt="song 2 cover">
                        <span>It's Always Blue</span>
                    </div>
                    <div class="songItem">
                        <img src="covers/3.jpg" alt="song 3 cover">
                        <span>It's Always Blue</span>
                    </div>
                    <div class="songItem">
                        <img src="covers/4.jpg" alt="song 4 cover">
                        <span>It's Always Blue</span>
                    </div>
                    <div class="songItem">
                        <img src="covers/5.jpg" alt="song 5 cover">
                        <span>It's Always Blue</span>
                    </div>
                    <div class="songItem">
                        <img src="covers/6.jpg" alt="song 6 cover">
                        <span>It's Always Blue</span>
                    </div>
                    <div class="songItem">
                        <img src="covers/7.jpg" alt="song 7 cover">
                        <span>It's Always Blue</span>
                    </div>
                    <div class="songItem">
                        <img src="covers/8.jpg" alt="song 8 cover">
                        <span>It's Always Blue</span>
                    </div>
                    <div class="songItem">
                        <img src="covers/9.jpg" alt="song 9 cover">
                        <span>It's Always Blue</span>
                    </div>
                    <div class="songItem">
                        <img src="covers/10.jpg" alt="song 10 cover">
                        <span>It's Always Blue</span>
                    </div>
                </section>
            </div>
            <div id="about">

            </div>
        </main>
    </div>
    <footer>
        <div class="songInformation">

        </div>
        <div class="playerControls">
            <button class="button">
                <i class=" prev-btn fa-solid fa-backward-step"></i>
            </button>
            <button class="button">
                <i class="play-btn fa-solid fa-play"></i>
            </button>
            <button class="button">
                <i class="next-btn fa-solid fa-forward-step"></i>
            </button>
        </div>
        <input type="range" min="0" max="100" value="0">


    </footer>

    <script src="https://kit.fontawesome.com/128a6ac123.js" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
